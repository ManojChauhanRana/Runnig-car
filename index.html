<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="body">
    <!-- <header><h1>start</h1>
        <h2>end</h2></header> -->

    <div class="container">
        <div class="sky">

            <div class="traffic">
                <div class="trafficLight">
                    <div class="redLight" id="redLight"></div>
                    <div class="orangeLight" id="orangeLight"></div>
                    <div class="greenLight" id="greenLight"></div>
                </div>
                <div class="pole" id="pole"></div>
            </div>
            <div class="trees"></div>
            <div class="track" id="track"></div>
            <div class="city" id="city"></div>
            <div class="car" id="car">
                <div class="wheel wheel1" id="wheel1">
                    <img src="car_wheel_left.png" alt="">
                </div>
                <div class="wheel wheel2" id="wheel2">
                    <img src="car_wheel_right.png" alt="">
                </div>
                <div class="carp2" id="carp2">
                    <div class="wheel wheelp21" id="wheelp21">
                        <img src="car_wheel_left.png" alt="">
                    </div>
                    <div class="wheel wheelp22" id="wheelp22">
                        <img src="car_wheel_right.png" alt="">
                    </div>
                    <div class="siren2" id="siren2">
                        <img src="siren.gif" alt="">
                        <audio autopause loop>
                            <source src="PoliceSiren.mp3" type="audio/mp3">
                        </audio>
                    </div>
                </div>
               
                <div class="brake" id="brake">
                    <img src="break3.png" id="brid" alt="">
                </div>
                <div class="race" id="race">
                    <img src="break3.png" id="raid" alt="">
                </div>
                <div class="gear">
                    <div class="gear1" id="gear1">
                        <h1>1</h1>
                    </div>
                    <div class="gear2" id="gear2">
                        <h1>2</h1>
                    </div>
                    <div class="gear3" id="gear3">
                        <h1>3</h1>
                    </div>
                    <div class="gear4" id="gear4">
                        <h1>4</h1>
                    </div>
                    <div class="gearB" id="gearB">
                        <h1>B</h1>
                    </div>
                    <div class="gearN" id="gearN">
                        <h1>N</h1>
                    </div>
                    <div class="horn" id="horn">
                        <h1>p</h1>
                    </div>
                    <div class="score" >
                        <h1>Score: <span id="score">0</span></h1>
                    </div>
                    <a class="exit" href="start.html">Exit</a> 
                </div>
                <div class="musicsound">
                    <div class="music" id="music">
                        <i class="fa-2x fa-solid fa-music"></i>
                    </div>
                    <div class="sound" id="sound">
                        <i class="fa-2x fa-solid fa-volume-off"></i>
                    </div>
                </div>

            </div>


            <div class="car2" id="car2">
                <div class="wheel wheel11" id="wheel11">
                    <img src="car_wheel_left.png" alt="">
                </div>
                <div class="wheel wheel12" id="wheel12">
                    <img src="car_wheel_right.png" alt="">
                </div>
                <div class="carp" id="carp">
                    <div class="wheel wheelp1" id="wheelp1">
                        <img src="car_wheel_left.png" alt="">
                    </div>
                    <div class="wheel wheelp2" id="wheelp2">
                        <img src="car_wheel_right.png" alt="">
                    </div>
                    <div class="siren" id="siren">
                        <img src="siren.gif" alt="">
                        <audio autopause loop>
                            <source src="PoliceSirene.mp3" type="audio/mp3">
                        </audio>
                    </div>
                </div>
                <div class="car3" id="car3">
                    <div class="wheel wheel31" id="wheel31">
                        <img src="car_wheel_left.png" alt="">
                    </div>
                    <div class="wheel wheel32" id="wheel32">
                        <img src="car_wheel_right.png" alt="">
                    </div>
                </div>

            </div>
        </div>
        <script src="script.js"></script>
        <script src="https://kit.fontawesome.com/8bad95100b.js" crossorigin="anonymous"></script>
</body>

</html>
